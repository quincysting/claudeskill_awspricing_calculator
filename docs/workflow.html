<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aws-pricing-calculator skill · Workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · aws-pricing-calculator skill</p>
    <h1>From an architecture brief to a calculator link</h1>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane dividers -->

      <text x="48" y="118" fill="#7a8399" font-size="9" font-family="'Geist', sans-serif">local files</text>
      <text x="48" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CALCULATOR DATA</text>
      <text x="48" y="238" fill="#7a8399" font-size="9" font-family="'Geist', sans-serif">public · read-only</text>

      <text x="48" y="466" fill="#7a8399" font-size="9" font-family="'Geist', sans-serif">saved once</text>

      <line x1="272" y1="204" x2="272" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Schemas → Build (validate) -->
      <path d="M 352,228 H 420 Q 428,228 428,220 V 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="484" y1="136" x2="484" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Load → Read back -->
      <line x1="536" y1="348" x2="560" y2="348" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 640,320 V 116 Q 640,108 632,108 H 536" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- Read back → Save (calculator costs) -->
      <path d="M 720,348 H 789 Q 797,348 797,340 V 136" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Save → Link -->
      <line x1="851" y1="136" x2="851" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Connector labels -->
      <rect x="280" y="180" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="304" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SKELETON</text>
      <rect x="362" y="208" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="386" y="217" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VALIDATE</text>
      <rect x="492" y="290" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="514" y="299" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOAD.JS</text>
      <rect x="648" y="194" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="684" y="203" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIX + REBUILD</text>
      <rect x="727" y="256" width="62" height="12" rx="2" fill="#f5f5f5"/>
      <text x="758" y="265" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COSTS BY ID</text>
      <rect x="859" y="392" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="883" y="401" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE API</text>

      <!-- Nodes -->
      <!-- 1-3 Assumptions + spec -->
      <rect x="192" y="80" width="160" height="56" rx="6" fill="#f5f5f5"/>

      <rect x="200" y="86" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="214" y="95" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1–3</text>

      <text x="272" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">calc_discover.py</text>

      <!-- 4 Build + validate -->
      <rect x="376" y="80" width="160" height="56" rx="6" fill="#f5f5f5"/>

      <rect x="384" y="86" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>

      <!-- 6 Apply costs + save -->
      <rect x="744" y="80" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="80" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="752" y="86" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="766" y="95" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">6</text>
      <text x="824" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Apply costs + save</text>
      <text x="824" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">calc_save.py --costs</text>

      <!-- Live service schemas (external) -->
      <rect x="192" y="204" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="192" y="204" width="160" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="200" y="210" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="214" y="219" fill="rgba(45,49,66,0.7)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CDN</text>
      <text x="272" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Live service schemas</text>
      <text x="272" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">definitions · pricing</text>

      <!-- 5 Load into calculator -->
      <rect x="376" y="320" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="376" y="320" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="384" y="326" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="398" y="335" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">5</text>
      <text x="456" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Load into calculator</text>
      <text x="456" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tab only · not saved</text>

      <!-- 5 Read back prices (focal) -->
      <rect x="560" y="320" width="160" height="56" rx="6" fill="#f5f5f5"/>

      <text x="582" y="335" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">5</text>
      <text x="640" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read back prices</text>
      <text x="640" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser_readback.js</text>

      <!-- 7 Shareable link (external) -->
      <rect x="744" y="432" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="432" width="160" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="752" y="438" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="766" y="447" fill="rgba(45,49,66,0.7)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">7</text>
      <text x="824" y="462" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shareable link</text>
      <text x="824" y="474" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">…/#/estimate?id=…</text>

      <!-- Legend -->
      <line x1="40" y1="528" x2="920" y2="528" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="546" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="560" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step (number = SKILL.md step)</text>

      <rect x="212" y="560" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="232" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">AWS-hosted</text>

      <rect x="320" y="560" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="340" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Calculator's own prices</text>

      <line x1="476" y1="565" x2="504" y2="565" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="512" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow</text>

      <line x1="568" y1="565" x2="596" y2="565" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <line x1="776" y1="565" x2="804" y2="565" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="812" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Costs carried into save</text>
    </svg>
  </div>
</body>
