<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aws-pricing-calculator skill · Workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · aws-pricing-calculator skill</p>
    <h1>From an architecture brief to a calculator link</h1>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane dividers -->
      <line x1="40" y1="40" x2="920" y2="40" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="176" x2="920" y2="176" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="280" x2="920" y2="280" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="384" x2="920" y2="384" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="176" y1="40" x2="176" y2="384" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="48" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CLAUDE + SCRIPTS</text>
      <text x="48" y="118" fill="#7a8399" font-size="9" font-family="'Geist', sans-serif">local files</text>
      <text x="48" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CALCULATOR DATA</text>
      <text x="48" y="238" fill="#7a8399" font-size="9" font-family="'Geist', sans-serif">public · read-only</text>
      <text x="48" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">PUBLIC LINK</text>
      <text x="48" y="342" fill="#7a8399" font-size="9" font-family="'Geist', sans-serif">shareable · editable</text>

      <line x1="592" y1="108" x2="672" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="272" y1="204" x2="272" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 352,228 H 504 Q 512,228 512,220 V 136" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Save → Link -->
      <line x1="752" y1="136" x2="752" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Connector labels -->
      <rect x="280" y="180" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="304" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SKELETON</text>
      <rect x="404" y="208" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="428" y="217" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VALIDATE</text>
      <rect x="760" y="236" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="784" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE API</text>

      <!-- Nodes -->
      <!-- Assumptions + spec -->
      <rect x="192" y="80" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="192" y="80" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="200" y="86" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="216" y="95" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPEC</text>

      <text x="272" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">calc_discover.py</text>

      <!-- Build + validate (focal) -->
      <rect x="432" y="80" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="80" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="440" y="86" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="456" y="95" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUILD</text>
      <text x="512" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build + validate</text>
      <text x="512" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">calc_build.py</text>

      <!-- Save estimate -->
      <rect x="672" y="80" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="80" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="680" y="86" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="696" y="95" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAVE</text>
      <text x="752" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Save estimate</text>
      <text x="752" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">calc_save.py</text>

      <!-- Live service schemas (external) -->
      <rect x="192" y="204" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="192" y="204" width="160" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="200" y="210" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="216" y="219" fill="rgba(45,49,66,0.7)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CDN</text>
      <text x="272" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Live service schemas</text>
      <text x="272" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">definitions · pricing</text>

      <!-- Shareable link (external) -->
      <rect x="672" y="308" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="308" width="160" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="680" y="314" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="696" y="323" fill="rgba(45,49,66,0.7)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">URL</text>
      <text x="752" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shareable link</text>
      <text x="752" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">…/#/estimate?id=…</text>

      <!-- Legend -->
      <line x1="40" y1="408" x2="920" y2="408" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="426" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="440" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="448" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <rect x="120" y="440" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="140" y="448" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">AWS-hosted</text>

      <rect x="236" y="440" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="256" y="448" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Validated against the live calculator</text>

      <line x1="428" y1="445" x2="456" y2="445" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="464" y="448" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow</text>

      <line x1="516" y1="445" x2="544" y2="445" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="552" y="448" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Schema check</text>
    </svg>
  </div>
</body>
</html>
